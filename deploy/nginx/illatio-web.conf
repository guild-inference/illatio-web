# Optional static-origin template. Install only after production authorization.
# Deploy each package-site output into /var/www/<target>/.
# Configure your own TLS listener and domain-covering certificate separately.
server {
    listen 127.0.0.1:8083;
    server_name illatio.dev;
    root /var/www/illatio;
    index index.html;
    error_page 404 /404.html;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; }
}
