    listen 127.0.0.1:8083;
    server_name labs.illatio.dev;
    root /var/www/labs;
    index index.html;
    error_page 404 /404.html;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; }
}
