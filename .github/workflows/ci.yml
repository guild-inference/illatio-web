name: Verify and preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run typecheck
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 14
      - name: Build persistent Pages preview
        run: npm run build
        env:
          BASE_PATH: /illatio-web
          SITE_URL: https://guild-inference.github.io
          PUBLIC_GUILD_URL: https://guild-inference.github.io/guild-web
          PUBLIC_DEPLOYMENT: preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  deploy-worker:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build production Worker bundle
        run: npm run build
        env:
          PUBLIC_DEPLOYMENT: production
      - name: Verify Cloudflare Worker bundle (--dry-run)
        run: npx wrangler deploy --dry-run
      - name: Deploy to Cloudflare Workers (when CLOUDFLARE_API_TOKEN is configured)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
